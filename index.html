<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stallcart | Amazon Clone</title>

  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="toast-container"></div>

  <!-- Floating Navbar -->
  <header id="main-header" class="modern-header">
    <div class="nav-container container">
      <a href="#home" class="nav-logo-modern">
        <i class="fa-solid fa-cart-shopping user-icon-accent"></i>
        <span>StallCart</span>
      </a>

      <div class="nav-links">
        <form class="nav-search-modern" id="search-form">
          <input type="text" id="search-input" placeholder="Search for products, brands and more...">
          <button type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
        </form>
      </div>

      <div class="nav-actions">
        <a href="#account" id="nav-auth-link" class="action-btn">
          <i class="fa-regular fa-user"></i>
          <span class="action-text">Sign In</span>
        </a>
        <a href="#cart" class="action-btn cart-btn">
          <i class="fa-solid fa-cart-shopping"></i>
          <span class="action-text">Cart</span>
          <span id="nav-cart-count" class="cart-badge">0</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Main View Container for SPA -->
  <main id="app-content"></main>

  <footer class="modern-footer">
    <div class="footer-bottom-bar">
      <div class="footer-links-inline">
        <a href="#">About Us</a>
        <span class="divider">|</span>
        <a href="#">Contact Us</a>
        <span class="divider">|</span>
        <a href="#">Privacy Policy</a>
        <span class="divider">|</span>
        <a href="#">Terms & Conditions</a>
        <span class="divider">|</span>
        <div class="social-icons">
          <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
          <a href="#"><i class="fa-brands fa-twitter"></i></a>
          <a href="#"><i class="fa-brands fa-instagram"></i></a>
        </div>
      </div>
    </div>
  </footer>

  <!-- App Scripts -->
  <script src="data.js"></script>
  <script src="script.js"></script>
</body>

</html>
